[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-interviewer"
version = "0.1.0"
description = "Minimal CLI scaffold for ic-interviewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1,<4",
  "openai>=2,<3",
  "pydantic>=2,<3",
  "typer>=0.12,<1.0",
]

[project.scripts]
ic-interviewer = "ic_interviewer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
